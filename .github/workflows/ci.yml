# Checks every pull request and push to main. Release builds are made on a
# Mac with a fixed signing identity (see BUILD.md), not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x prettier --check .
      - run: bun run lint
      - run: bun x tsc --noEmit

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Frontend build (bundled into the app)
        run: bun run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --release --lib
        working-directory: src-tauri
